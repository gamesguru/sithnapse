[package]
# We name the package `synapse` so that things like logging have the right
# logging target.
name = "synapse"

# dummy version. See pyproject.toml for the Synapse's version number.
version = "0.1.0"

edition = "2021"
rust-version = "1.82.0"

[lib]
name = "synapse"
# We generate a `cdylib` for Python and a standard `lib` for running
# tests/benchmarks.
crate-type = ["lib", "cdylib"]

# This is deprecated, see tool.maturin in pyproject.toml.
# It is left here for compatibilty with maturin < 0.15.
[package.metadata.maturin]
# This is where we tell maturin where to place the built library.
name = "synapse.synapse_rust"

[dependencies]
async-trait = "0.1.89"
anyhow = "1.0.63"
base64 = "0.22.1"
bytes = "1.6.0"
hmac = "0.12.1"
headers = "0.4.0"
hex = "0.4.3"
http = "1.1.0"
lazy_static = "1.4.0"
log = "0.4.17"
mime = "0.3.17"
pyo3 = { version = "0.29.0", features = [
    "macros",
    "anyhow",
    "abi3",
    "abi3-py310",
    # So we can pass `bytes::Bytes` directly back to Python efficiently,
    # https://docs.rs/pyo3/latest/pyo3/bytes/index.html
    "bytes",
] }
pyo3-log = "0.13.4"
pythonize = { version = "0.29.0", features = ["arbitrary_precision"] }
regex = "1.6.0"
sha2 = "0.10.8"
serde = { version = "1.0.144", features = ["derive", "rc"] }
serde_json = { version = "1.0.85", features = [
    "raw_value",
    # We need to be able to parse arbitrary precision numbers, as some numbers
    # in the database may be out of range of i64 (as Python uses arbitrary
    # precision integers).
    "arbitrary_precision",
] }
ulid = "1.1.2"
# Keep the shared ICU 2.x graph compatible with CI's Rust 1.87 MSRV.  A loose
# `2.0` requirement otherwise resolves to ICU 2.3, which requires Rust 1.88.
# icu_provider/icu_locale_core are transitive-only (pulled in via idna ->
# url -> reqwest), not direct deps of ours, so pinning icu_segmenter alone
# doesn't constrain them -- `cargo update` (even without touching this file)
# can still bump them past 2.2.0 on its own range. Pin them explicitly here
# too so they can't drift independently of icu_segmenter.
icu_segmenter = "=2.2.0"
# NOTE: pinned to match icu_segmenter; transitive-only but must not drift past 2.2.0 (MSRV 1.87)
icu_provider = "=2.2.0"
icu_locale_core = "=2.2.0"
# Transitive-only (pulled in via rand, quinn-proto, tempfile), not a direct
# dep of ours -- pinned so a `cargo update` can't silently bump it to a new
# major on its own, the same reasoning as the icu_* pins above. Held at the
# older 0.3.x line deliberately (not the newer 0.4.x some dependents also
# accept): 0.2.x is also still present transitively for dependents that
# haven't moved past it.
getrandom = "=0.3.4"
# Transitive-only (sha1/sha2/keccak use the 0.2.x line; pinned here for the
# same drift reason as getrandom above). NOT a full fix on its own: rand
# 0.10.x -> chacha20 0.10.2 hard-requires cpufeatures ^0.3, and 0.3.1 (the
# only 0.3.x release published) requires `edition2024`, unstable on this
# crate's pinned rust-version (1.82.0, see the top of this file) -- `cargo
# +1.82.0 build`/`clippy` fails just parsing that manifest, regardless of
# whether cpufeatures 0.3.1 is actually compiled for this target. This pin
# doesn't remove that second copy (chacha20's own requirement can't be
# satisfied by 0.2.x); still investigating whether pinning something further
# up the chain (chacha20, rand, or quinn-proto/reqwest's quinn pull) avoids
# it, since no 0.3.0 (pre-edition2024) release of cpufeatures exists to fall
# back to.
cpufeatures = "=0.2.17"
reqwest = { version = "0.12.15", default-features = false, features = [
    "http2",
    "stream",
    "rustls-tls-native-roots",
] }
http-body-util = "0.1.3"
futures = "0.3.31"
tokio = { version = "1.44.2", features = ["rt", "rt-multi-thread"] }
once_cell = "1.18.0"
lru = "0.12"
rezzy = { git = "https://gitlab.com/gamesguru/rezzy.git", branch = "alpha" }
mtxdb = { git = "https://gitlab.com/wombat-foundation/mtxdb.git", branch = "refactor/pack-id-store-layout", features = ["multi-reader"] }

[build-dependencies]
blake2 = "0.10.4"
hex = "0.4.3"
rustc_version = "0.4.1"

[[bench]]
name = "state_hamt"
path = "benches/state_hamt.rs"
harness = false

[package.metadata.cargo-machete]
ignored = ["icu_provider", "icu_locale_core", "getrandom"]

[dev-dependencies]
itertools = "0.14.0"
tempfile = "3.27.0"
