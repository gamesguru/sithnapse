# Re-usable workflow (https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows)
name: Reusable Complement testing

on:
  workflow_call:
    inputs:
      use_latest_deps:
        type: boolean
        default: false
      use_twisted_trunk:
        type: boolean
        default: false

# Control the permissions granted to `GITHUB_TOKEN`.
permissions:
  # `actions/checkout` reads the repository (also see
  # https://github.com/actions/checkout/tree/de0fac2e4500dabe0009e67214ff5f5447ce83dd/#recommended-permissions)
  contents: read

env:
  RUST_VERSION: 1.87.0
  UV_HTTP_RETRIES: 5
  DOCKER_BUILD_ARGS: "--cache-from=type=gha --cache-to=type=gha,mode=max"
  COMPLEMENT_REPO: "gamesguru/complement"

jobs:
  complement:
    runs-on: ubuntu-latest
    env:
      # Complement invokes this on the host before stopping each PostgreSQL
      # homeserver, while its integrated database is still queryable.
      COMPLEMENT_POST_TEST_SCRIPT: ${{ startsWith(matrix.database, 'Postgres') && format('{0}/synapse/.ci/scripts/dump_complement_postgres_stats.sh', github.workspace) || '' }}
      COMPLEMENT_POSTGRES_STATS_DIR: /tmp/complement-postgres-stats

    strategy:
      fail-fast: false
      matrix:
        include:
          - arrangement: monolith
            database: SQLite

          - arrangement: hybrid
            database: SQLite (hybrid, mtxdb)
            # The one sync-on mtxdb lane: it is the smoke alarm for the
            # durability path and the only lane where SYNAPSE_MTXDB_STATS can
            # report a real fsync/checkpoint split. The other mtxdb lanes run
            # no_sync for speed.
            mtxdb_no_sync: false

          - arrangement: monolith
            database: Postgres

          - arrangement: hybrid
            database: Postgres (hybrid, mtxdb)
            mtxdb_no_sync: true

          - arrangement: workers
            database: Postgres

          - arrangement: workers
            database: Postgres (hybrid, mtxdb)
            mtxdb_no_sync: true

    steps:
      - name: Checkout synapse codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: synapse

      # Log Docker system info for debugging (compare with your local environment) and
      # tracking GitHub runner changes over time (can easily compare a run from last
      # week with the current one in question).
      - run: docker system info
        shell: bash

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # We use `uv` in `complement.sh`
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.5.31"
          enable-cache: true
          python-version: "3.12"

      - name: Prepare Complement's Prerequisites
        run: synapse/.ci/scripts/setup_complement_prerequisites.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: complement/go.sum
          go-version-file: complement/go.mod

      # This step is specific to the 'Twisted trunk' test run:
      - name: Patch dependencies
        if: ${{ inputs.use_twisted_trunk }}
        run: |
          set -x
          uv remove twisted
          uv add "twisted[tls] @ git+https://github.com/twisted/twisted.git#trunk"
          uv lock
        working-directory: synapse

      - name: Run Complement Tests
        id: run_complement_tests
        run: |
          COMPLEMENT_DIR=`pwd`/complement synapse/scripts-dev/complement.sh
        shell: bash
        env:
          POSTGRES: ${{ (startsWith(matrix.database, 'Postgres')) && 1 || '' }}
          WORKERS: ${{ (matrix.arrangement == 'workers') && 1 || '' }}
          # complement.sh only honours the TEST_-scoped names (and blanks the
          # bare ones to keep a developer's production env out of containers),
          # so the engine/path MUST use the SYNAPSE_TEST_ prefix or the
          # "hybrid, mtxdb" job silently boots plain SQLite.
          SYNAPSE_TEST_EMBEDDED_HAMT_ENGINE: ${{ (contains(matrix.database, 'mtxdb')) && 'mtxdb' || '' }}
          SYNAPSE_TEST_EMBEDDED_HAMT_PATH: ${{ (contains(matrix.database, 'mtxdb')) && '/data/embedded_hamt' || '' }}
          # Per-lane durability: all mtxdb lanes except the sync-on smoke alarm
          # disable fsync. complement.sh forwards NO_SYNC/STATS as their
          # in-container SYNAPSE_MTXDB_* equivalents.
          SYNAPSE_TEST_MTXDB_NO_SYNC: ${{ matrix.mtxdb_no_sync && '1' || '' }}
          SYNAPSE_TEST_MTXDB_STATS: ${{ (contains(matrix.database, 'mtxdb') && !matrix.mtxdb_no_sync) && '1' || '' }}
          TEST_ONLY_IGNORE_POETRY_LOCKFILE: ${{ inputs.use_latest_deps && 1 || '' }}
          TEST_ONLY_SKIP_DEP_HASH_VERIFICATION: ${{ inputs.use_twisted_trunk  && 1 || '' }}
          RESULTS_DIR: tests/complement/main

      - name: Formatted Complement log (only failing tests shown)
        if: always() && steps.run_complement_tests.outcome != 'skipped'
        continue-on-error: true
        run: jq -Rrc 'fromjson? // empty' synapse/tests/complement/main/logs.jsonl | gotestfmt -hide "successful-downloads,successful-tests,empty-packages"

      - name: Run in-repo Complement Tests
        id: run_in_repo_complement_tests
        # -f: reuse the image built by the main run above (same checkout, same
        #     PASS_* env) instead of rebuilding 3 images a second time.
        run: |
          COMPLEMENT_DIR=`pwd`/complement synapse/scripts-dev/complement.sh --in-repo -f
        shell: bash
        env:
          POSTGRES: ${{ (startsWith(matrix.database, 'Postgres')) && 1 || '' }}
          WORKERS: ${{ (matrix.arrangement == 'workers') && 1 || '' }}
          # complement.sh only honours the TEST_-scoped names (and blanks the
          # bare ones to keep a developer's production env out of containers),
          # so the engine/path MUST use the SYNAPSE_TEST_ prefix or the
          # "hybrid, mtxdb" job silently boots plain SQLite.
          SYNAPSE_TEST_EMBEDDED_HAMT_ENGINE: ${{ (contains(matrix.database, 'mtxdb')) && 'mtxdb' || '' }}
          SYNAPSE_TEST_EMBEDDED_HAMT_PATH: ${{ (contains(matrix.database, 'mtxdb')) && '/data/embedded_hamt' || '' }}
          # Per-lane durability: all mtxdb lanes except the sync-on smoke alarm
          # disable fsync. complement.sh forwards NO_SYNC/STATS as their
          # in-container SYNAPSE_MTXDB_* equivalents.
          SYNAPSE_TEST_MTXDB_NO_SYNC: ${{ matrix.mtxdb_no_sync && '1' || '' }}
          SYNAPSE_TEST_MTXDB_STATS: ${{ (contains(matrix.database, 'mtxdb') && !matrix.mtxdb_no_sync) && '1' || '' }}
          TEST_ONLY_IGNORE_POETRY_LOCKFILE: ${{ inputs.use_latest_deps && 1 || '' }}
          TEST_ONLY_SKIP_DEP_HASH_VERIFICATION: ${{ inputs.use_twisted_trunk  && 1 || '' }}
          RESULTS_DIR: tests/complement/in-repo

      - name: Formatted in-repo Complement log (only failing tests shown)
        if: always() && steps.run_in_repo_complement_tests.outcome != 'skipped'
        continue-on-error: true
        run: jq -Rrc 'fromjson? // empty' synapse/tests/complement/in-repo/logs.jsonl | gotestfmt -hide "successful-downloads,successful-tests,empty-packages"

      - name: Print PostgreSQL statistics
        if: ${{ always() && startsWith(matrix.database, 'Postgres') }}
        run: |
          if [ -d /tmp/complement-postgres-stats ]; then
            echo "================================================================"
            echo "          COMPLEMENT POSTGRESQL DIAGNOSTICS & STATS             "
            echo "================================================================"
            for f in /tmp/complement-postgres-stats/*.txt; do
              [ -e "$f" ] || continue
              echo "--- $f ---"
              cat "$f"
              echo
            done
          fi

      - name: Upload PostgreSQL statistics
        if: ${{ always() && startsWith(matrix.database, 'Postgres') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Complement PostgreSQL stats - (${{ matrix.arrangement }}, ${{ matrix.database }})
          path: /tmp/complement-postgres-stats
          if-no-files-found: warn

      - name: Upload Complement logs
        # The runner writes raw Go JSON and its result ledger separately for
        # each run, while printing compact progress live in the job log.
        #
        # main/*.jsonl (and the other two named dirs) are only populated by a
        # single `cp` after the whole `go test` invocation returns -- if the
        # process is killed or the runner dies before that point, those files
        # stay empty even though every event up to the cutoff was already
        # durably written, incrementally, to the `.tmp/complement/*.jsonl`
        # staged files as it went. Upload those too so a mid-run failure
        # still leaves real diagnostics instead of nothing.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          # The matrix values keep the name unique across the three matrix
          # combinations (upload-artifact rejects duplicate names within a run).
          name: Complement Logs - ${{ job.status }} - (${{ matrix.arrangement }}, ${{ matrix.database }})
          path: |
            synapse/tests/complement/main/logs.jsonl
            synapse/tests/complement/main/results.jsonl
            synapse/tests/complement/in-repo/logs.jsonl
            synapse/tests/complement/in-repo/results.jsonl
            synapse/.tmp/complement/*.jsonl
          if-no-files-found: warn
