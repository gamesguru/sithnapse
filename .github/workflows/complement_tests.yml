# Re-usable workflow (https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows)
name: Reusable Complement testing

on:
  workflow_call:
    inputs:
      use_latest_deps:
        type: boolean
        default: false
      use_twisted_trunk:
        type: boolean
        default: false
      worker_profile:
        description: >
          Worker process topology for the workers lanes. Use `reduced` on
          PR/push runs and `full` for the nightly full-topology lane.
        type: string
        default: reduced
      only_workers:
        description: Only run the workers matrix rows.
        type: boolean
        default: false

# Control the permissions granted to `GITHUB_TOKEN`.
permissions:
  # `actions/checkout` reads the repository (also see
  # https://github.com/actions/checkout/tree/de0fac2e4500dabe0009e67214ff5f5447ce83dd/#recommended-permissions)
  contents: read

env:
  RUST_VERSION: 1.88.0
  UV_HTTP_RETRIES: 5
  DOCKER_BUILD_ARGS: "--cache-from=type=gha --cache-to=type=gha,mode=max"
  COMPLEMENT_REPO: "gamesguru/complement"

jobs:
  matrix:
    # A job-level `if` cannot see `matrix`, and `include` rows cannot be
    # filtered with expressions, so build the matrix here and drop the
    # non-workers rows when only_workers is set.
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        env:
          ONLY_WORKERS: ${{ inputs.only_workers }}
        run: |
          # The mtxdb lanes run with sync off: Complement containers are
          # destroyed after every test, so the durable fsync path buys nothing.
          include='[
            {"arrangement": "monolith", "database": "SQLite"},
            {"arrangement": "hybrid", "database": "SQLite (hybrid, mtxdb)", "mtxdb_sync_mode": "off"},
            {"arrangement": "monolith", "database": "Postgres"},
            {"arrangement": "hybrid", "database": "Postgres (hybrid, mtxdb)", "mtxdb_sync_mode": "off"},
            {"arrangement": "workers", "database": "Postgres"},
            {"arrangement": "workers", "database": "Postgres (hybrid, mtxdb)", "mtxdb_sync_mode": "off"}
          ]'
          echo "include=$(jq -c --argjson only "$ONLY_WORKERS" \
            'map(select(($only | not) or .arrangement == "workers"))' <<< "$include")" \
            >> "$GITHUB_OUTPUT"

  complement:
    needs: matrix
    runs-on: ubuntu-latest
    env:
      # Complement invokes this on the host before stopping each PostgreSQL
      # homeserver, while its integrated database is still queryable.
      COMPLEMENT_POST_TEST_SCRIPT: ${{ startsWith(matrix.database, 'Postgres') && format('{0}/synapse/.ci/scripts/dump_complement_postgres_stats.sh', github.workspace) || '' }}
      COMPLEMENT_POSTGRES_STATS_DIR: /tmp/complement-postgres-stats
      # Packages/tests run in parallel by `go test` (-p / -parallel). Keep this
      # at complement.sh's default: a GitHub runner has 4 vCPUs and every test
      # deploys two homeservers (each is postgres, redis, nginx and a dozen
      # synapse processes in workers mode), so raising it starves homeserver
      # startup and fails deployments with "timed out checking for homeserver
      # to be up".
      COMPLEMENT_PARALLEL: 2

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - name: Checkout synapse codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: synapse

      # Log Docker system info for debugging (compare with your local environment) and
      # tracking GitHub runner changes over time (can easily compare a run from last
      # week with the current one in question).
      - run: docker system info
        shell: bash

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # We use `uv` in `complement.sh`
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.5.31"
          enable-cache: true
          python-version: "3.12"

      - name: Prepare Complement's Prerequisites
        run: synapse/.ci/scripts/setup_complement_prerequisites.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: complement/go.sum
          go-version-file: complement/go.mod

      # This step is specific to the 'Twisted trunk' test run:
      - name: Patch dependencies
        if: ${{ inputs.use_twisted_trunk }}
        run: |
          set -x
          uv remove twisted
          uv add "twisted[tls] @ git+https://github.com/twisted/twisted.git#trunk"
          uv lock
        working-directory: synapse

      # Sample host load and per-container CPU for the whole run, so startup
      # cost can be told apart from steady-state worker overhead. Paired with
      # Complement's "deploy-timing" log line (startup-to-ready per homeserver).
      - name: Start resource sampler
        run: |
          mkdir -p /tmp/complement-resources
          nohup bash -c '
            while true; do
              ts=$(date +%s)
              echo "$ts $(cut -d" " -f1-3 /proc/loadavg)" >> /tmp/complement-resources/loadavg.txt
              docker stats --no-stream --format "$ts\t{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}" \
                >> /tmp/complement-resources/docker_stats.tsv 2>/dev/null
              sleep 5
            done
          ' > /dev/null 2>&1 &
          echo $! > /tmp/complement-resources/sampler.pid

      - name: Run Complement Tests
        id: run_complement_tests
        run: |
          COMPLEMENT_DIR=`pwd`/complement synapse/scripts-dev/complement.sh
        shell: bash
        env:
          POSTGRES: ${{ (startsWith(matrix.database, 'Postgres')) && 1 || '' }}
          WORKERS: ${{ (matrix.arrangement == 'workers') && 1 || '' }}
          SYNAPSE_COMPLEMENT_WORKER_PROFILE: ${{ inputs.worker_profile }}
          # complement.sh only honours the TEST_-scoped names (and blanks the
          # bare ones to keep a developer's production env out of containers),
          # so the engine/path MUST use the SYNAPSE_TEST_ prefix or the
          # "hybrid, mtxdb" job silently boots plain SQLite.
          SYNAPSE_TEST_EMBEDDED_DB_ENGINE: ${{ (contains(matrix.database, 'mtxdb')) && 'mtxdb' || '' }}
          SYNAPSE_TEST_EMBEDDED_DB_PATH: ${{ (contains(matrix.database, 'mtxdb')) && '/data/embedded_db' || '' }}
          # Complement mtxdb lanes disable fsync for speed; containers are
          # destroyed after every test, so durability adds no value here.
          SYNAPSE_TEST_MTXDB_SYNC_MODE: ${{ contains(matrix.database, 'mtxdb') && matrix.mtxdb_sync_mode || '' }}
          SYNAPSE_TEST_MTXDB_STATS: ${{ (contains(matrix.database, 'mtxdb') && matrix.mtxdb_sync_mode != 'off') && '1' || '' }}
          TEST_ONLY_IGNORE_POETRY_LOCKFILE: ${{ inputs.use_latest_deps && 1 || '' }}
          TEST_ONLY_SKIP_DEP_HASH_VERIFICATION: ${{ inputs.use_twisted_trunk  && 1 || '' }}
          RESULTS_DIR: tests/complement/main

      - name: Formatted Complement log (only failing tests shown)
        if: always() && steps.run_complement_tests.outcome != 'skipped'
        continue-on-error: true
        # A failed Complement package can contain minutes of captured homeserver
        # logs. Keep status events for every test, but only send output belonging
        # to failed tests (or failed packages) to gotestfmt; the complete JSONL
        # is uploaded below.
        run: |
          jq -Rsc '
            split("\n")
            | map(fromjson? // empty) as $events
            | [$events[] | select(.Action == "fail" and .Test != null) | .Test] as $failed_tests
            | [$events[] | select(.Action == "fail" and .Test == null) | .Package] as $failed_packages
            | $events[]
            | select(
                .Action != "output"
                or (if .Test != null
                    then (.Test as $test | $failed_tests | index($test) != null)
                    else (.Package as $pkg | $failed_packages | index($pkg) != null)
                    end)
              )
          ' synapse/tests/complement/main/logs.jsonl | gotestfmt -hide "successful-downloads,successful-tests,empty-packages"

      - name: Run in-repo Complement Tests
        # Always run as long as we attempted to run the original Complement tests.
        # This lets us get a status report on the in-repo tests, even if the
        # standard Complement test suite fails.
        if: always() && steps.run_complement_tests.outcome != 'skipped'
        id: run_in_repo_complement_tests
        # -f: reuse the image built by the main run above (same checkout, same
        #     PASS_* env) instead of rebuilding 3 images a second time.
        run: |
          COMPLEMENT_DIR=`pwd`/complement synapse/scripts-dev/complement.sh --in-repo -f
        shell: bash
        env:
          POSTGRES: ${{ (startsWith(matrix.database, 'Postgres')) && 1 || '' }}
          WORKERS: ${{ (matrix.arrangement == 'workers') && 1 || '' }}
          SYNAPSE_COMPLEMENT_WORKER_PROFILE: ${{ inputs.worker_profile }}
          # complement.sh only honours the TEST_-scoped names (and blanks the
          # bare ones to keep a developer's production env out of containers),
          # so the engine/path MUST use the SYNAPSE_TEST_ prefix or the
          # "hybrid, mtxdb" job silently boots plain SQLite.
          SYNAPSE_TEST_EMBEDDED_DB_ENGINE: ${{ (contains(matrix.database, 'mtxdb')) && 'mtxdb' || '' }}
          SYNAPSE_TEST_EMBEDDED_DB_PATH: ${{ (contains(matrix.database, 'mtxdb')) && '/data/embedded_db' || '' }}
          # Complement mtxdb lanes disable fsync for speed; containers are
          # destroyed after every test, so durability adds no value here.
          SYNAPSE_TEST_MTXDB_SYNC_MODE: ${{ contains(matrix.database, 'mtxdb') && matrix.mtxdb_sync_mode || '' }}
          SYNAPSE_TEST_MTXDB_STATS: ${{ (contains(matrix.database, 'mtxdb') && matrix.mtxdb_sync_mode != 'off') && '1' || '' }}
          TEST_ONLY_IGNORE_POETRY_LOCKFILE: ${{ inputs.use_latest_deps && 1 || '' }}
          TEST_ONLY_SKIP_DEP_HASH_VERIFICATION: ${{ inputs.use_twisted_trunk  && 1 || '' }}
          RESULTS_DIR: tests/complement/in-repo

      - name: Formatted in-repo Complement log (only failing tests shown)
        if: always() && steps.run_in_repo_complement_tests.outcome != 'skipped'
        continue-on-error: true
        run: |
          jq -Rsc '
            split("\n")
            | map(fromjson? // empty) as $events
            | [$events[] | select(.Action == "fail" and .Test != null) | .Test] as $failed_tests
            | [$events[] | select(.Action == "fail" and .Test == null) | .Package] as $failed_packages
            | $events[]
            | select(
                .Action != "output"
                or (if .Test != null
                    then (.Test as $test | $failed_tests | index($test) != null)
                    else (.Package as $pkg | $failed_packages | index($pkg) != null)
                    end)
              )
          ' synapse/tests/complement/in-repo/logs.jsonl | gotestfmt -hide "successful-downloads,successful-tests,empty-packages"

      - name: Summarise startup and CPU usage
        if: always() && steps.run_complement_tests.outcome != 'skipped'
        continue-on-error: true
        run: |
          kill "$(cat /tmp/complement-resources/sampler.pid)" 2>/dev/null || true
          jq -r 'select(.Action == "output") | .Output' synapse/tests/complement/main/logs.jsonl \
            | grep -o 'ready_after=[0-9.]*' | cut -d= -f2 | sort -n \
            > /tmp/complement-resources/ready_after.txt || true
          echo "Homeserver startup-to-ready (seconds):"
          awk '{a[NR]=$1; s+=$1} END {
            if (NR == 0) { print "  no deploy-timing lines (Complement checkout lacks them?)"; exit }
            printf "  n=%d total=%.0f mean=%.2f p50=%.2f p90=%.2f max=%.2f\n",
              NR, s, s/NR, a[int(NR*0.5)+1], a[int(NR*0.9)+1], a[NR] }' \
            /tmp/complement-resources/ready_after.txt
          echo "Host load average (1m) over the run:"
          awk '{s+=$2; if ($2>m) m=$2} END { if (NR) printf "  samples=%d mean=%.2f max=%.2f\n", NR, s/NR, m }' \
            /tmp/complement-resources/loadavg.txt
          echo "Summed container CPU% per sample (400% = all 4 vCPUs):"
          awk -F'\t' '{gsub("%","",$3); t[$1]+=$3} END {
            for (k in t) { n++; s+=t[k]; if (t[k]>m) m=t[k] }
            if (n) printf "  samples=%d mean=%.0f%% max=%.0f%%\n", n, s/n, m }' \
            /tmp/complement-resources/docker_stats.tsv

      - name: Print PostgreSQL statistics
        if: ${{ always() && startsWith(matrix.database, 'Postgres') }}
        run: |
          if [ -d /tmp/complement-postgres-stats ]; then
            echo "================================================================"
            echo "          COMPLEMENT POSTGRESQL DIAGNOSTICS & STATS             "
            echo "================================================================"
            for f in /tmp/complement-postgres-stats/*.txt; do
              [ -e "$f" ] || continue
              echo "--- $f ---"
              cat "$f"
              echo
            done
          fi

      - name: Upload PostgreSQL statistics
        if: ${{ always() && startsWith(matrix.database, 'Postgres') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Complement PostgreSQL stats - (${{ matrix.arrangement }}, ${{ matrix.database }})
          path: /tmp/complement-postgres-stats
          if-no-files-found: warn

      - name: Upload Complement logs
        # The runner writes raw Go JSON and its result ledger separately for
        # each run, while printing compact progress live in the job log.
        #
        # main/*.jsonl (and the other two named dirs) are only populated by a
        # single `cp` after the whole `go test` invocation returns -- if the
        # process is killed or the runner dies before that point, those files
        # stay empty even though every event up to the cutoff was already
        # durably written, incrementally, to the `.tmp/complement/*.jsonl`
        # staged files as it went. Upload those too so a mid-run failure
        # still leaves real diagnostics instead of nothing.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          # The matrix values keep the name unique across the three matrix
          # combinations (upload-artifact rejects duplicate names within a run).
          name: Complement Logs - ${{ job.status }} - (${{ matrix.arrangement }}, ${{ matrix.database }})
          path: |
            synapse/tests/complement/main/logs.jsonl
            synapse/tests/complement/main/results.jsonl
            synapse/tests/complement/in-repo/logs.jsonl
            synapse/tests/complement/in-repo/results.jsonl
            synapse/.tmp/complement/*.jsonl
          if-no-files-found: warn

      - name: Upload resource samples
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: Complement resources - (${{ matrix.arrangement }}, ${{ matrix.database }})
          path: /tmp/complement-resources
          if-no-files-found: warn
